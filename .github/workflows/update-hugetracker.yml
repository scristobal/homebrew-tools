name: Update hUGETracker Formula and Cask

on:
  schedule:
    - cron: "42 12 * * *"  # run daily at 12:42 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-hugetracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Get latest stable release, its commit and source SHA256
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE=$(curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/SuperDisk/hUGETracker/releases/latest)
          VERSION=$(jq -er '
            select(.draft == false and .prerelease == false)
            | .tag_name
            | capture("^v(?<version>[0-9]+\\.[0-9]+\\.[0-9]+)$").version
          ' <<< "$RELEASE")

          # The formula builds from git so it gets the submodules; pin the tagged
          # commit, peeling it first if the tag is annotated.
          TAG="v${VERSION}"
          REFS=$(git ls-remote --tags https://github.com/SuperDisk/hUGETracker.git "$TAG" "${TAG}^{}")
          REVISION=$(awk -v tag="refs/tags/$TAG" '
            $2 == tag "^{}" { peeled = $1 }
            $2 == tag { direct = $1 }
            END { print (peeled != "" ? peeled : direct) }
          ' <<< "$REFS")
          if [[ ! "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve ${TAG} to a commit, found:" >&2
            echo "$REFS" >&2
            exit 1
          fi

          # The cask only downloads the tag's source tarball to satisfy Homebrew.
          TARBALL=$(mktemp)
          trap 'rm -f "$TARBALL"' EXIT
          curl --fail --location --retry 3 \
            "https://github.com/SuperDisk/hUGETracker/archive/refs/tags/${TAG}.tar.gz" --output "$TARBALL"
          SHA=$(sha256sum "$TARBALL" | awk '{print $1}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
      - name: Update formula and cask and commit changes
        env:
          VERSION: ${{ steps.release.outputs.version }}
          REVISION: ${{ steps.release.outputs.revision }}
          SHA: ${{ steps.release.outputs.sha256 }}
        run: |
          set -euo pipefail
          FORMULA="Formula/hugetracker.rb"
          sed -i -E "s/^(      tag:      \")v[^\"]+(\",)$/\1v${VERSION}\2/" "$FORMULA"
          sed -i -E "s/^(      revision: \")[0-9a-f]{40}(\")$/\1${REVISION}\2/" "$FORMULA"
          ruby -c "$FORMULA"
          grep -q "tag:      \"v${VERSION}\"," "$FORMULA"
          grep -q "revision: \"${REVISION}\"" "$FORMULA"

          # The cask copies the formula's app, so both move to the same release together.
          CASK="Casks/hugetracker.rb"
          sed -i -E "s/^  version \".*\"$/  version \"${VERSION}\"/" "$CASK"
          sed -i -E "s/^  sha256 \".*\"$/  sha256 \"${SHA}\"/" "$CASK"
          ruby -c "$CASK"

          if git diff --quiet -- "$FORMULA" "$CASK"; then
            echo "hUGETracker is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FORMULA" "$CASK"
          git commit -m "chore: bump hugetracker to v${VERSION}"
          # Other formula updaters may have pushed while this job was running.
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
